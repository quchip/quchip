[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "quchip"
dynamic = ["version"]
description = "Differentiable quantum device modelling toolkit"
authors = [{name = "Ibraheem AlYousef", email = "ibraheem@quchip.org"}]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "numpy",
    "qutip>=5.0",
    "scipy",
    "matplotlib",
    "tqdm",
    "loky",
    "jax",
]

[project.optional-dependencies]
# dynamiqs 0.3.6 fails to import with jax>=0.11.1; drop the jax bound once a
# dynamiqs release includes https://github.com/dynamiqs/dynamiqs/pull/1145.
dynamiqs = ["dynamiqs>=0.3.6", "jax<0.11.1"]
viz = ["pyvis"]
scqubits = ["scqubits>=4.2", "qutip<5.3.1"]
test = ["pytest", "pyvis", "scqubits>=4.2", "qutip<5.3.1", "jupytext", "nbconvert", "ipykernel"]
dev = ["ruff", "mypy", "pytest", "pyvis", "jupytext", "nbconvert", "ipykernel"]
docs = ["sphinx", "furo", "myst-parser", "sphinx-copybutton"]

[project.urls]
Homepage = "https://quchip.org"
Documentation = "https://docs.quchip.org"
Repository = "https://github.com/quchip/quchip"
Issues = "https://github.com/quchip/quchip/issues"
Paper = "https://arxiv.org/abs/2607.17081"

[tool.setuptools.dynamic]
version = {attr = "quchip.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: small deterministic component and API-contract checks",
    "e2e: daily integration and physics workflows",
    "validation: expensive numerical, gradient, and exhaustive checks",
    "release: notebook re-execution and other checks that run only before a release",
    "core: root-directory tests (legacy location marker, not a runtime guarantee)",
    "physics_sentinel: compact simulation-backed regression coverage for critical physics invariants",
    "extended: slower long-tail coverage outside the default developer loop",
    "examples: freshness and receipt coverage for the shipped examples",
    "optional_backend: tests that require the dynamiqs optional backend",
    "viz: visualization coverage",
]


[tool.setuptools.package-data]
quchip = ["py.typed"]

[tool.setuptools.packages.find]
include = ["quchip*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
disable_error_code = ["empty-body"]
