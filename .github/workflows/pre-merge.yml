name: pre-merge

# Completes the suite after the required fast lanes. Documentation-only PRs
# skip it; other changes run validation when the PR is ready for review.
# Manual dispatch explicitly requests the same validation suite.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        uses: ./.github/actions/classify-pr

  test-full:
    name: pre-merge full suite
    needs: changes
    # Classification errors fail even on drafts; ready code changes run validation.
    if: >-
      always() &&
      (needs.changes.result != 'success' ||
       (needs.changes.outputs.full_ci != 'true' && needs.changes.outputs.full_ci != 'false') ||
       (needs.changes.outputs.full_ci == 'true' &&
        (github.event_name != 'pull_request' || !github.event.pull_request.draft)))
    runs-on: ubuntu-latest
    # JAX keeps compiled programs here between runs; compilation is most of the suite's time.
    env:
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
      JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "-1"
      JAX_COMPILATION_CACHE_MAX_SIZE: "500000000"
    steps:
      - name: Require a valid change classification
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          FULL_CI: ${{ needs.changes.outputs.full_ci }}
        run: |
          if [[ "$CLASSIFICATION_RESULT" != "success" || "$FULL_CI" != "true" ]]; then
            echo "::error::Could not classify this change."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci-constraints-*.txt
      - run: uv venv --python 3.11
      - run: uv pip install -e '.[test,dynamiqs]' -c ci-constraints-3.11.txt
      # Each run saves a new entry and restores the latest one for the same locked dependencies.
      - uses: actions/cache@v4
        with:
          path: .jax-cache
          key: jax-${{ github.job }}-py3.11-${{ hashFiles('ci-constraints-3.11.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jax-${{ github.job }}-py3.11-${{ hashFiles('ci-constraints-3.11.txt') }}-
      # Validation completes the separately required unit and E2E suites.
      # Collection enforces exactly one of those three suites for each test.
      - name: Validation tests
        # The suite takes about 4 minutes on hosted runners. The limit catches a hung solve.
        timeout-minutes: 10
        run: uv run --no-sync pytest -m validation --durations=20
