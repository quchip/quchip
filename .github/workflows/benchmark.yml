name: benchmark

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark to run
        type: choice
        options: [closed-system, conditional-response]
        default: closed-system
      base_ref:
        description: Comparison commit or ref (relative to the selected branch)
        type: string
        default: HEAD^

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closed-system:
    if: ${{ inputs.suite != 'conditional-response' }}
    name: closed-system overhead
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BENCHMARK_RUNGS: "1,2,3,4,5,6,7"
      BUILD_REPEAT: "5"
      SOLVE_REPEAT: "7"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JAX_ENABLE_X64: "true"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      MPLCONFIGDIR: /tmp/quchip-matplotlib
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci-constraints-3.11.txt

      - name: Install benchmark environment
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dynamiqs]' -c ci-constraints-3.11.txt

      - name: Resolve comparison commit
        id: comparison
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          base_sha=$(git rev-parse --verify "${BASE_REF}^{commit}")
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Record environment
        run: |
          mkdir -p benchmark-output
          {
            uv run --no-sync python --version
            uv pip freeze
            uname -a
            lscpu
          } > benchmark-output/environment.txt

      - name: Run benchmark
        id: benchmark
        run: |
          uv run --no-sync python benchmarks/closed_system.py run \
            --base-ref "${{ steps.comparison.outputs.base_sha }}" \
            --rungs "$BENCHMARK_RUNGS" \
            --build-repeat "$BUILD_REPEAT" \
            --warmup 1 \
            --solve-repeat "$SOLVE_REPEAT" \
            --out benchmark-output/closed-system.json

      - name: Render report
        id: report
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        run: |
          uv run --no-sync python benchmarks/closed_system.py report \
            --data benchmark-output/closed-system.json \
            --out-dir benchmark-output \
            --summary benchmark-output/summary.md

      - name: Upload benchmark bundle
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: closed-system-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-output
          if-no-files-found: warn
          retention-days: 90

      - name: Publish job summary
        if: ${{ !cancelled() && steps.report.outcome != 'skipped' }}
        run: |
          if [ -f benchmark-output/summary.md ]; then
            cat benchmark-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n[Download JSON, environment, samples, and plots](%s)\n' \
            "${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

  conditional-response:
    if: ${{ inputs.suite == 'conditional-response' }}
    name: conditional response before and after
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      JAX_ENABLE_X64: "true"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      MPLCONFIGDIR: /tmp/quchip-matplotlib
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci-constraints-3.11.txt
      - name: Install benchmark environment
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dynamiqs]' -c ci-constraints-3.11.txt
      - name: Record environment and comparison source
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          base_sha=$(git rev-parse --verify "${BASE_REF}^{commit}")
          git worktree add --detach "$RUNNER_TEMP/quchip-response-base" "$base_sha"
          mkdir -p benchmark-output
          {
            uv run --no-sync python --version
            uv pip freeze
            uname -a
            lscpu
          } > benchmark-output/environment.txt
      - name: Measure base and head sequentially
        run: |
          uv run --no-sync python benchmarks/conditional_response.py \
            --source "$RUNNER_TEMP/quchip-response-base" --out benchmark-output/base.json
          uv run --no-sync python benchmarks/conditional_response.py \
            --source "$GITHUB_WORKSPACE" --out benchmark-output/head.json
      - name: Upload timing samples and environment
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: conditional-response-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-output
          retention-days: 90
