name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Verify tag matches package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="dist/quchip-${version}-py3-none-any.whl"
          sdist="dist/quchip-${version}.tar.gz"
          if [[ ! -f "$wheel" || ! -f "$sdist" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the built package version."
            exit 1
          fi
          python3 tools/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"
      - name: Check package metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          python3 tools/release_notes.py "$version" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "quchip ${version}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
