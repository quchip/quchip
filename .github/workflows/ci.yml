name: ci

# Installs are locked with ci-constraints-<python>.txt so runs are
# reproducible; regenerate with tools/compile_ci_constraints.sh. The weekly
# fresh-resolution check lives in deps-canary.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci-constraints-*.txt
      - run: uv venv --python 3.11
      - run: uv pip install -e '.[dev,test,dynamiqs]' -c ci-constraints-3.11.txt
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy quchip

  test-fast:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci-constraints-*.txt
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e '.[test]' -c ci-constraints-${{ matrix.python }}.txt
      - run: uv run --no-sync pytest -m "core or physics_sentinel"

  test-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci-constraints-*.txt
      - run: uv venv --python 3.11
      - run: uv pip install -e '.[test,dynamiqs]' -c ci-constraints-3.11.txt
      - run: uv run --no-sync pytest
